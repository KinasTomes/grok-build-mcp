[package]
name = "xai-grok-mcp-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MCP gateway runtime for the Grok Build local tool frontend"

[dependencies]
anyhow = { workspace = true }
rmcp = { version = "2.1", default-features = false, features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
axum = { workspace = true }
subtle = "2"
serde_json = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, optional = true }
dunce = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true, features = ["crossterm"] }
crossterm = { workspace = true, optional = true, features = ["event-stream"] }
xai-file-utils = { path = "../xai-file-utils" }
xai-grok-sandbox = { path = "../xai-grok-sandbox" }
xai-grok-mcp = { workspace = true }
xai-grok-config-types = { workspace = true }
xai-grok-session-events = { workspace = true }
xai-grok-tools = { workspace = true }

[dev-dependencies]
rmcp = { version = "2.1", default-features = false, features = [
    "client",
    "server",
    "transport-async-rw",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
cli = ["dep:clap", "dep:dunce", "dep:tracing-subscriber"]
ui = ["cli", "dep:ratatui", "dep:crossterm"]

[[bin]]
name = "xai-grok-mcp"
path = "src/bin/xai_grok_mcp/main.rs"
required-features = ["cli"]

[lints]
workspace = true
