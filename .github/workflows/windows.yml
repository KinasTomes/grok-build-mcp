name: Windows Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-mcp

      - name: Install protoc
        shell: powershell
        run: |
          choco install protoc -y
          $protoc = (Get-Command protoc).Source
          echo "PROTOC=$protoc" >> $env:GITHUB_ENV
          protoc --version

      - name: Build Windows release
        run: cargo build --release -p xai-grok-pager-bin

      - name: Smoke test Grok MCP commands
        shell: powershell
        run: |
          .\target\release\xai-grok-pager.exe --help
          .\target\release\xai-grok-pager.exe mcp server --help

      - name: Package Windows binaries
        shell: powershell
        run: |
          $dist = "target\release\dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          # `grok.exe` is the full Grok Build CLI. `mcp server` starts its
          # observer TUI by default; `--headless` disables it.
          Copy-Item target\release\xai-grok-pager.exe "$dist\grok.exe"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: grok-build-mcp-windows-x64
          path: target/release/dist
