name: Windows Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-mcp

      - name: Install protoc
        shell: powershell
        run: |
          choco install protoc -y
          $protoc = (Get-Command protoc).Source
          echo "PROTOC=$protoc" >> $env:GITHUB_ENV
          protoc --version

      - name: Build & package Windows releases (headless + UI)
        shell: powershell
        run: |
          $dist = "target\release\dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          cargo build --release -p xai-grok-mcp-server --bin xai-grok-mcp --features cli
          .\target\release\xai-grok-mcp.exe --help
          Copy-Item target\release\xai-grok-mcp.exe "$dist\xai-grok-mcp-headless.exe"

          cargo build --release -p xai-grok-mcp-server --bin xai-grok-mcp --features ui
          .\target\release\xai-grok-mcp.exe --help
          Copy-Item target\release\xai-grok-mcp.exe "$dist\xai-grok-mcp.exe"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: grok-build-mcp-windows-x64
          path: target/release/dist
