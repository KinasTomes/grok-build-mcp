name: Windows Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-mcp

      - name: Install protoc
        shell: powershell
        run: |
          choco install protoc -y
          $protoc = (Get-Command protoc).Source
          echo "PROTOC=$protoc" >> $env:GITHUB_ENV
          protoc --version

      - name: Build Windows release
        run: cargo build --release -p xai-grok-mcp-server

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: xai-grok-mcp-server-windows-x64
          path: target/release/xai-grok-mcp-server.exe
